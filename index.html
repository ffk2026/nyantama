<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:type" content="website">
<meta property="og:title" content="にゃんたまブンブン">
<meta property="og:description" content="猫のたまをタップしてぷるん・ブルブル・ブンブン。くだらないけどクセになる。">

<style>
/* ========== 見た目（CSS） ========== */
:root {
  --ink: #4a3628;
  --paper: #fff8ec;
  --accent: #ff7f6e;
  --accent-dark: #d95a4a;
  --card: #fffdf8;
  --border: #ecd9bf;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Hiragino Maru Gothic ProN", "Zen Maru Gothic", "M PLUS Rounded 1c", "Yu Gothic", sans-serif;
  color: var(--ink);
  background: var(--paper);
  display: grid;
  grid-template-columns: 1fr 340px;
  min-height: 100vh;
}
/* --- 左：猫のいるステージ --- */
#stage {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  user-select: none;
  -webkit-user-select: none;
  transition: background 0.5s;
}
#stage.bg-engawa { background: linear-gradient(#ffe9c7 0 68%, #d9a066 68% 70%, #c48a50 70%); }
#stage.bg-night  { background: radial-gradient(circle at 80% 18%, #fff6c9 0 38px, transparent 40px), linear-gradient(#1d2547 0 68%, #2c2a3d 68%); color: #fff; }
#stage.bg-space  {
  background:
    radial-gradient(1.5px 1.5px at 12% 20%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 30% 70%, #fff, transparent),
    radial-gradient(2px 2px at 55% 12%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 72% 55%, #fff, transparent),
    radial-gradient(2px 2px at 88% 30%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 42% 40%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 8% 85%, #fff, transparent),
    radial-gradient(circle at 20% 110%, #5b3d8f, #0b0a1f 60%);
  color: #fff;
}
header { text-align: center; padding: 18px 12px 0; }
h1 { margin: 0; font-size: clamp(22px, 4vw, 34px); letter-spacing: 0.06em; }
#score { margin-top: 6px; font-size: 15px; }
#count { font-size: 26px; font-weight: bold; color: var(--accent); margin: 0 4px; font-variant-numeric: tabular-nums; }
#rank { display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 13px; }
#catsvg { flex: 1; width: min(100%, 560px); min-height: 0; max-height: calc(100vh - 150px); touch-action: none; }
#hint { padding: 0 12px 14px; font-size: 13px; opacity: 0.75; text-align: center; }
#bubble {
  position: absolute; top: 148px; left: 50%; transform: translateX(-50%);
  background: #fff; color: #4a3628; border: 3px solid #4a3628; border-radius: 18px;
  padding: 6px 14px; font-size: 16px; font-weight: bold; white-space: nowrap;
  opacity: 0; transition: opacity 0.25s; pointer-events: none;
}
#bubble.show { opacity: 1; }
.pop {
  position: absolute; font-weight: bold; font-size: 22px; color: var(--accent);
  text-shadow: 0 0 4px #fff, 0 0 4px #fff, 0 0 4px #fff;
  pointer-events: none; animation: pop 0.9s ease-out forwards;
}
@keyframes pop {
  from { opacity: 1; transform: translate(-50%, -50%) scale(0.6) rotate(var(--r)); }
  to   { opacity: 0; transform: translate(calc(-50% + var(--dx)), -170%) scale(1.3) rotate(var(--r)); }
}
/* --- 猫の色は CSS 変数で切り替える --- */
#catsvg { --fur:#f0a45a; --fur2:#c9722c; --line:#6b3e1c; --ball:#f7c08a; --paw:#f0a45a; --tail:#f0a45a; --earL:#f0a45a; --earR:#f0a45a; }
.fur  { fill: var(--fur);  stroke: var(--line); stroke-width: 4; stroke-linejoin: round; }
.paw  { fill: var(--paw);  stroke: var(--line); stroke-width: 4; }
.toe  { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.pads { display: none; fill: #f29c9c; }
[data-pose="fumi"] .pads { display: inline; }
[data-pose="fumi"] .toe { display: none; }
#tailFill { stroke: none; }
.detail { fill: none; stroke: var(--line); stroke-width: 2.5; stroke-linecap: round; opacity: 0.45; }
.stripe { fill: none; stroke: var(--fur2); stroke-width: 11; stroke-linecap: round; }
.pattern { display: none; }
[data-pattern="tabby"] .p-tabby, [data-pattern="mike"] .p-mike { display: inline; }
#tailWrap { transform-origin: 200px 272px; animation: wag 2.4s ease-in-out infinite; }
@keyframes wag { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg); } }
#headG, #bodyG, .leg { transition: transform 0.45s cubic-bezier(.4,1.6,.5,1); }
[data-pose="nobi"] #headG { transform: translateY(78px); }
[data-pose="nobi"] #bodyG { transform: translateY(-14px); }
[data-pose="fumi"] #legL { animation: fumi 0.7s ease-in-out infinite; }
[data-pose="fumi"] #legR { animation: fumi 0.7s ease-in-out infinite 0.35s; }
[data-pose="fumi"] #bodyG { transform-origin: 200px 420px; animation: sway 0.7s ease-in-out infinite; }
@keyframes fumi { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes sway { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
#balls { cursor: grab; }
#balls:active { cursor: grabbing; }

/* --- 右：設定パネル --- */
aside {
  background: var(--card); border-left: 2px solid var(--border);
  padding: 16px; overflow-y: auto; max-height: 100vh;
}
aside h2 { font-size: 14px; margin: 16px 0 8px; }
aside h2:first-child { margin-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button, .btn {
  font: inherit; font-size: 14px; color: var(--ink);
  border: 2px solid var(--border); background: #fff; border-radius: 99px;
  padding: 6px 12px; cursor: pointer; transition: transform 0.1s;
}
.chips button:active, .btn:active { transform: scale(0.94); }
.chips button.on { background: var(--accent); border-color: var(--accent-dark); color: #fff; }
.row { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 14px; }
.row label { flex: 0 0 96px; }
.row input[type=range] { flex: 1; accent-color: var(--accent); }
.row input[type=color] { width: 44px; height: 30px; border: 2px solid var(--border); border-radius: 8px; padding: 0; background: #fff; }
.note { font-size: 12px; opacity: 0.7; min-height: 1.4em; margin: 6px 0 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.btn.primary { background: var(--accent); border-color: var(--accent-dark); color: #fff; font-weight: bold; }
#shareBtn.ready { background: #1d1d1f; border-color: #1d1d1f; color: #fff; font-weight: bold; animation: nudge 0.6s ease-in-out 3; }
@keyframes nudge { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

#mood { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; font-size: 12px; }
#mood .bar { width: 150px; height: 10px; border-radius: 99px; background: rgba(0,0,0,0.15); overflow: hidden; }
#moodFill { display: block; height: 100%; width: 100%; background: #6cc070; border-radius: 99px; }
#hint.live { font-size: 20px; font-weight: bold; opacity: 1; color: var(--accent); text-shadow: 0 0 4px #fff, 0 0 4px #fff; }
.badge { font-size: 12px; border: 2px solid var(--border); border-radius: 10px; padding: 4px 8px; background: #fff; opacity: 0.45; }
.badge.got { opacity: 1; background: #fff3c4; border-color: #e5b93c; }

@media (max-width: 820px) {
  body { grid-template-columns: 1fr; }
  #stage { height: 72vh; }
  #catsvg { max-height: none; }
  aside { border-left: none; border-top: 2px solid var(--border); max-height: none; }
}
</style>
</head>

      <clipPath id="clipBody"><path id="bodyBase" d="M200 196C245 196 272 222 282 262C296 290 312 318 310 356C308 400 262 426 200 426C138 426 92 400 90 356C88 318 104 290 118 262C128 222 155 196 200 196Z"/></clipPath>
      <clipPath id="clipHead"><path id="headBase" d="M200 98C246 98 280 130 280 172C280 214 246 242 200 242C154 242 120 214 120 172C120 130 154 98 200 98Z"/></clipPath>

  <h2>あそび</h2>

<script>
/* ========== 動き（JavaScript） ========== */

// ---- 選べるもの一覧。ここに足せば選択肢が増える ----
const BREEDS = {
  chatora: { name: '茶トラ',   fur: '#f0a45a', fur2: '#c9722c', line: '#6b3e1c', ball: '#f7c08a', pattern: 'tabby' },
  shiro:   { name: 'しろ',     fur: '#fbf7f0', fur2: '#fbf7f0', line: '#5a4a42', ball: '#f6c9c4', pattern: 'none' },
  kuro:    { name: 'くろ',     fur: '#3a3a42', fur2: '#3a3a42', line: '#17171c', ball: '#2b2b32', pattern: 'none' },
  saba:    { name: 'サバトラ', fur: '#a9adb3', fur2: '#5f646c', line: '#33373d', ball: '#c9ccd1', pattern: 'tabby' },
  hachi:   { name: 'ハチワレ', fur: '#33333a', fur2: '#33333a', line: '#17171c', ball: '#f4f1ec', pattern: 'none', paw: '#ffffff', note: '靴下をはいています' },
  mike:    { name: '三毛',     fur: '#fbf7f0', fur2: '#3a3a42', line: '#5a4a42', ball: '#fbf7f0', pattern: 'mike', earL: '#3a3a42', earR: '#f0a045', note: 'オスの三毛猫は約3万匹に1匹。超レア！' },
  siam:    { name: 'シャム',   fur: '#efe3cf', fur2: '#5b4336', line: '#3b2a22', ball: '#5b4336', pattern: 'none', paw: '#5b4336', tail: '#5b4336', earL: '#5b4336', earR: '#5b4336', note: '先っぽだけ濃いポイントカラー' },
};
const POSES = {
  stand: { name: 'たち',     tail: 'M200 272C202 238 234 218 242 182C248 154 238 126 254 100' },
  nobi:  { name: 'のび〜',   tail: 'M200 272 C198 230 170 200 176 160 C182 118 240 116 238 156 C237 172 222 176 216 166' },
  fumi:  { name: 'ふみふみ', tail: 'M200 272 C204 232 232 206 228 164 C226 140 214 122 202 110' },
};
const COATS = { short: '短毛', long: '長毛' };
// d を書かないしっぽは、ポーズごとの形（POSES の tail）を使う。
// w は「付け根(t=0)から先(t=1)までの太さの半分」、jag は毛のギザギザの長さ
const TAILS = {
  long: { name: 'ながい',     w: (t) => 15 - 5 * t },
  fusa: { name: 'ふさふさ',   w: (t) => 13 + 13 * Math.sin(Math.PI * t ** 0.7), jag: 4 },
  kagi: { name: 'かぎしっぽ', w: (t) => 14 - 2 * t, d: 'M200 272C200 240 194 216 204 202C210 193 222 187 234 184' },
  bob:  { name: 'ボブ',       w: () => 19, d: 'M200 264L200 258' },
};
const MODES = { purun: 'ぷるん', buru: 'ブルブル', bun: 'ブンブン' };
const BGS = { engawa: '縁側', night: '夜', space: '宇宙' };
const RANKS = [[0, '見習い'], [10, 'たまタッチャー'], [50, 'ブンブン初段'], [100, 'プリッと師範'], [300, 'たまマイスター'], [1000, 'にゃんたま仙人']];
const LINES = {
  purun: ['にゃ？', '…にゃに？', 'ふにゃ', 'そこはちょっと', 'ぷるんて言うにゃ'],
  buru:  ['にゃにゃにゃにゃ', 'くすぐったいにゃ', 'ふるえるにゃ〜'],
  bun:   ['にゃにゃ！？', '目が回るにゃ', 'まわすにゃ〜！', 'もう好きにするにゃ'],
};

// ---- 設定の保存と読み込み（ブラウザに覚えさせる） ----
const DEFAULTS = { breed: 'chatora', coat: 'short', tail: 'long', pose: 'stand', mode: 'purun', bg: 'engawa', size: 1, soft: 0.5, grav: 1, fur: null, ball: null, sound: true, count: 0 };
let cfg = { ...DEFAULTS };
try { Object.assign(cfg, JSON.parse(localStorage.getItem('nyantama') || '{}')); } catch (e) {}

if (!POSES[cfg.pose]) cfg.pose = DEFAULTS.pose;
if (!COATS[cfg.coat]) cfg.coat = DEFAULTS.coat;
if (!TAILS[cfg.tail]) cfg.tail = DEFAULTS.tail;
if (!MODES[cfg.mode]) cfg.mode = DEFAULTS.mode;
if (!BGS[cfg.bg]) cfg.bg = DEFAULTS.bg;
cfg.stats = Object.assign({ maxRpm: 0, maxCombo: 0, treats: 0, chalBest: 0 }, cfg.stats);
cfg.badges = cfg.badges || {}; cfg.seen = cfg.seen || {};
const save = () => { try { localStorage.setItem('nyantama', JSON.stringify(cfg)); } catch (e) {} };

const $ = (id) => document.getElementById(id);
const svg = $('catsvg'), stage = $('stage');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

// しっぽの中心線（base）のまわりに、太さ T.w の輪郭を作る
function tailShape(base, T, long, extra = 0) {
  const len = base.getTotalLength(), N = Math.max(6, Math.round(len / 7));
  const jag = (T.jag || 0) + (long ? 5 : 0), left = [], right = [];
  let w0 = 0, w1 = 0;
  for (let i = 0; i <= N; i++) {
    const t = i / N, p = base.getPointAtLength(t * len);
    const a = base.getPointAtLength(Math.max(0, t * len - 1)), b = base.getPointAtLength(Math.min(len, t * len + 1));
    const dl = Math.hypot(b.x - a.x, b.y - a.y) || 1, nx = -(b.y - a.y) / dl, ny = (b.x - a.x) / dl;
    let w = T.w(t) + (long ? 4 : 0) + extra;
    if (i === 0) w0 = w;
    if (i === N) w1 = w;
    if (i % 2 && i < N) w += jag;
    left.push((p.x + nx * w).toFixed(1) + ' ' + (p.y + ny * w).toFixed(1));
    right.push((p.x - nx * w).toFixed(1) + ' ' + (p.y - ny * w).toFixed(1));
  }
  return 'M' + left.join('L') + `A${w1} ${w1} 0 0 0 ${right[N]}L` + right.reverse().join('L') + `A${w0} ${w0} 0 0 0 ${left[0]}Z`;
}

// しっぽを描く。ガード中は、たまを隠す形にする
const GUARD_TAIL = 'M200 272C238 276 246 320 226 348C214 366 188 368 174 352';
function applyTail() {
  const T = TAILS[cfg.tail], guarding = guardT > 0;
  $('tailBase').setAttribute('d', guarding ? GUARD_TAIL : (T.d || POSES[cfg.pose].tail));
  const tailD = tailShape($('tailBase'), T, cfg.coat === 'long', guarding ? 8 : 0);
  ['tailFill', 'tailLine', 'tailClipP'].forEach((id) => $(id).setAttribute('d', tailD));
  $('tailRing').setAttribute('d', $('tailBase').getAttribute('d'));
}

// ---- 見た目を設定どおりに反映する ----
let R = 19, L = 31;   // たまの半径と、付け根からの距離
// あそびの状態：ごきげん、しっぽガードの残り秒、コンボ、10秒チャレンジ
let mood = 100, guardT = 0, combo = 0, lastTap = 0, chal = null, treatAt = -1e9, dirty = false, tick = 0;
const HINT = 'たまをタップ！ つまんで引っぱって離すのもおすすめ（スペースキーでもOK）';
// 輪郭の線に沿って、外向きの毛束を n 個つける（amp は毛束の長さ）
function fluff(base, n, amp, cx, cy) {
  const len = base.getTotalLength();
  const P = (t, a) => {
    const p = base.getPointAtLength((t % 1) * len), dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy) || 1;
    return (p.x + dx / d * a).toFixed(1) + ' ' + (p.y + dy / d * a).toFixed(1);
  };
  let d = 'M' + P(0, 0);
  for (let i = 0; i < n; i++) d += `Q${P((i + 0.35) / n, amp * 0.9)} ${P((i + 0.8) / n, amp)}L${P((i + 1) / n, 0)}`;
  return d + 'Z';
}
function applyLook() {
  const b = BREEDS[cfg.breed];
  const fur = cfg.fur || b.fur;
  const set = (k, v) => svg.style.setProperty(k, v);
  set('--fur', fur); set('--fur2', b.fur2); set('--line', b.line);
  set('--ball', cfg.ball || b.ball);
  set('--paw', b.paw || fur); set('--tail', b.tail || fur);
  set('--earL', b.earL || fur); set('--earR', b.earR || fur);
  svg.dataset.pattern = b.pattern;
  svg.dataset.pose = cfg.pose;
  const long = cfg.coat === 'long';
  applyTail(); cfg.seen[cfg.breed] = true;
  // 長毛のときは輪郭を毛束でギザギザにする
  const headD = long ? fluff($('headBase'), 30, 6, 200, 170) : $('headBase').getAttribute('d');
  const bodyD = long ? fluff($('bodyBase'), 38, 11, 200, 320) : $('bodyBase').getAttribute('d');
  $('headShape').setAttribute('d', headD); $('headLine').setAttribute('d', headD);
  $('bodyShape').setAttribute('d', bodyD); $('bodyLine').setAttribute('d', bodyD);
  stage.className = 'bg-' + cfg.bg;

  R = 19 * cfg.size; L = 20 + R * 0.6;
  // たまの真ん中のすじ
  $('raphe').setAttribute('d', `M0 ${-R * 0.45}Q${R * 0.14} ${R * 0.1} 0 ${R * 0.72}`);
  svg.querySelectorAll('.bL').forEach((c) => { c.setAttribute('cx', -R * 0.7); c.setAttribute('r', R); });
  svg.querySelectorAll('.bR').forEach((c) => { c.setAttribute('cx', R * 0.7); c.setAttribute('r', R); });
  svg.querySelectorAll('#balls .ballsPos:first-of-type circle').forEach((c) => c.setAttribute('r', R + 4));
  const hl = (el, x) => { el.setAttribute('cx', x - R * 0.3); el.setAttribute('cy', -R * 0.35); el.setAttribute('rx', R * 0.3); el.setAttribute('ry', R * 0.2); el.setAttribute('transform', `rotate(-30 ${x - R * 0.3} ${-R * 0.35})`); };
  hl(svg.querySelector('.hL'), -R * 0.7); hl(svg.querySelector('.hR'), R * 0.7);
  $('hit').setAttribute('r', R * 2.2);
  $('neckLine').setAttribute('stroke-width', R * 1.1 + 8);
  $('neckFill').setAttribute('stroke-width', R * 1.1);

  $('furColor').value = fur; $('ballColor').value = cfg.ball || b.ball;
  $('size').value = cfg.size; $('soft').value = cfg.soft; $('grav').value = cfg.grav;
  $('breedNote').textContent = b.note || '';
  $('soundBtn').textContent = cfg.sound ? '音 ON' : '音 OFF';
  document.querySelectorAll('.chips button').forEach((btn) => btn.classList.toggle('on', cfg[btn.dataset.key] === btn.dataset.val));
  showCount();
}
function showCount() {
  $('count').textContent = cfg.count;
  let r = RANKS[0][1];
  for (const [n, name] of RANKS) if (cfg.count >= n) r = name;
  if ($('rank').textContent !== r && cfg.count > 0) say('称号「' + r + '」にゃ！', true);
  $('rank').textContent = r;
}

// ---- 選択ボタンを作る ----
function chips(boxId, key, items, label) {
  for (const [val, item] of Object.entries(items)) {
    const btn = document.createElement('button');
    btn.textContent = label ? label(item) : item;
    btn.dataset.key = key; btn.dataset.val = val;
    btn.onclick = () => {
      cfg[key] = val;
      if (key === 'breed') { cfg.fur = null; cfg.ball = null; }   // 種類を選んだら自作の色は解除
      save(); applyLook();
    };
    $(boxId).appendChild(btn);
  }
}
chips('modeChips', 'mode', MODES);
chips('breedChips', 'breed', BREEDS, (b) => b.name);
chips('coatChips', 'coat', COATS);
chips('tailChips', 'tail', TAILS, (t) => t.name);
chips('poseChips', 'pose', POSES, (p) => p.name);
chips('bgChips', 'bg', BGS);
$('furColor').oninput = (e) => { cfg.fur = e.target.value; save(); applyLook(); };
$('ballColor').oninput = (e) => { cfg.ball = e.target.value; save(); applyLook(); };
for (const id of ['size', 'soft', 'grav']) $(id).oninput = (e) => { cfg[id] = +e.target.value; save(); applyLook(); };
$('soundBtn').onclick = () => { cfg.sound = !cfg.sound; save(); applyLook(); };

$('randomBtn').onclick = () => {
  cfg.breed = pick(Object.keys(BREEDS)); cfg.pose = pick(Object.keys(POSES));
  cfg.coat = pick(Object.keys(COATS)); cfg.tail = pick(Object.keys(TAILS));
  cfg.fur = null; cfg.ball = null; cfg.size = +rand(0.8, 1.6).toFixed(2);
  save(); applyLook(); tap(0, 0);
};

// ---- 音（その場で合成するので音声ファイルは不要） ----
let audio = null;
function blip(f0, f1, dur, type = 'sine', vol = 0.18, delay = 0) {
  if (!cfg.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime + delay, o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}

// ---- 猫のセリフと、飛び出す擬音 ----
let bubbleTimer = 0, lastSay = 0;
function say(text, force) {
  const now = performance.now();
  if (!force && now - lastSay < 1500) return;
  lastSay = now;
  $('bubble').textContent = text; $('bubble').classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => $('bubble').classList.remove('show'), 1400);
}
function pop(text, clientX, clientY) {
  const box = stage.getBoundingClientRect(), el = document.createElement('span');
  el.className = 'pop'; el.textContent = text;
  el.style.left = (clientX - box.left) + 'px'; el.style.top = (clientY - box.top) + 'px';
  el.style.setProperty('--dx', rand(-50, 50) + 'px'); el.style.setProperty('--r', rand(-15, 15) + 'deg');
  stage.appendChild(el); setTimeout(() => el.remove(), 900);
}

// ---- 物理：たまは「バネつき振り子」 ----
// th=振り子の角度  om=回る速さ  s=伸び  sv=伸びる速さ  q=ぷるぷる変形
let th = 0, om = 0, s = 0, sv = 0, q = 0, qv = 0, shakeT = 0, lift = 0, turn = 0, flying = false;
const SHAKE_DUR = 0.7;

// ---- あそび：しっぽガード、おやつ、10秒チャレンジ、実績 ----
function startGuard() {
  guardT = 3; cfg.stats.guard = true; om *= 0.2; combo = 0;
  $('bodyG').appendChild($('tailWrap'));               // しっぽを一番手前に出す
  applyTail(); say('もうダメにゃ！ しっぽガード！', true); blip(500, 200, 0.3, 'sawtooth', 0.08);
}
function endGuard() {
  guardT = 0; mood = Math.max(mood, 60);
  $('bodyG').insertBefore($('tailWrap'), $('butt'));   // しっぽを元の重なり順に戻す
  applyTail();
}
$('treatBtn').onclick = () => {
  const now = performance.now();
  if (now - treatAt < 5000) { say('さっき食べたにゃ', true); return; }
  treatAt = now; mood = Math.min(100, mood + 45); cfg.stats.treats++; dirty = true;
  if (guardT > 0) endGuard();
  const box = stage.getBoundingClientRect();
  pop('🐟', box.left + box.width / 2, box.top + box.height * 0.35);
  say(pick(['うまいにゃ！', 'もっとにゃ', 'ゆるすにゃ']), true); blip(600, 900, 0.15); blip(900, 1200, 0.15, 'sine', 0.18, 0.12);
  checkBadges();
};
$('chalBtn').onclick = () => {
  if (guardT > 0) endGuard();
  mood = 100; chal = { end: performance.now() + 10000, base: cfg.count };
  $('hint').classList.add('live'); say('よーい、ドン！', true); blip(700, 700, 0.3, 'square', 0.08);
};
// ---- シェア：スマホは端末の共有メニュー、パソコンは X の投稿画面を開く ----
const SITE_URL = 'https://ffk2026.github.io/nyantama/';
let lastChal = null;   // 直前の10秒チャレンジの回数
function shareText() {
  if (lastChal !== null) return `10秒で${lastChal}回にゃんたまをブンブンしたにゃ！ 記録に挑戦するにゃ`;
  let r = RANKS[0][1];
  for (const [n, name] of RANKS) if (cfg.count >= n) r = name;
  return `にゃんたまを${cfg.count}回ブンブンして称号「${r}」になったにゃ`;
}
$('shareBtn').onclick = async () => {
  const text = shareText() + ' #にゃんたまブンブン';
  const touch = window.matchMedia('(pointer: coarse)').matches;
  if (touch && navigator.share) {
    try { await navigator.share({ title: 'にゃんたまブンブン', text, url: SITE_URL }); } catch (e) {}
    return;
  }
  const u = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(SITE_URL);
  window.open(u, '_blank', 'noopener,width=600,height=500');
  $('shareBtn').classList.remove('ready');
};
$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(SITE_URL); say('リンクをコピーしたにゃ', true); }
  catch (e) { prompt('このリンクをコピーしてにゃ', SITE_URL); }
};

const BADGES = [
  ['first',  'はじめてのぷるん', 'まず1回',                 () => cfg.count >= 1],
  ['fly',    '竹とんぼ',         '回しまくると…',           () => cfg.stats.flew],
  ['pull',   'びよーん職人',     '限界まで引っぱる',        () => cfg.stats.stretch],
  ['combo',  '連打の鬼',         '20コンボ',                () => cfg.stats.maxCombo >= 20],
  ['rpm',    '高速回転',         '毎分600回転',             () => cfg.stats.maxRpm >= 600],
  ['guard',  'おこられた',       'さわりすぎると…',         () => cfg.stats.guard],
  ['treat',  'おやつ係',         'おやつを5回',             () => cfg.stats.treats >= 5],
  ['chal',   '10秒の達人',       '10秒チャレンジで50回',    () => cfg.stats.chalBest >= 50],
  ['zero',   '無重力ブンブン',   '重力ゼロで回す',          () => cfg.stats.zero],
  ['all',    '猫コンプリート',   '全種類の猫に会う',        () => Object.keys(BREEDS).every((k) => cfg.seen[k])],
  ['sennin', 'にゃんたま仙人',   '1000回',                  () => cfg.count >= 1000],
];
function renderBadges() {
  $('badges').innerHTML = '';
  let got = 0;
  for (const [id, name, hint] of BADGES) {
    const el = document.createElement('span'), has = !!cfg.badges[id];
    el.className = 'badge' + (has ? ' got' : ''); el.textContent = has ? '🏅 ' + name : '？ ' + hint;
    $('badges').appendChild(el); if (has) got++;
  }
  $('badgeCount').textContent = `${got} / ${BADGES.length}`;
  const st = cfg.stats;
  $('records').textContent = `最高回転 ${Math.round(st.maxRpm)}rpm ・ 最大コンボ ${st.maxCombo} ・ 10秒ベスト ${st.chalBest}回`;
}
function checkBadges() {
  let changed = false;
  for (const [id, name, , test] of BADGES) if (!cfg.badges[id] && test()) {
    cfg.badges[id] = true; changed = true;
    say('実績「' + name + '」にゃ！', true); blip(800, 1300, 0.25, 'triangle', 0.12);
  }
  if (changed) save();
  renderBadges();
}
document.addEventListener('keydown', (e) => {
  if (e.code !== 'Space' || e.repeat || /INPUT|BUTTON/.test(e.target.tagName)) return;
  e.preventDefault();
  const r = $('hit').getBoundingClientRect(); tap(r.x + r.width / 2, r.y + r.height / 2);
});

function tap(cx, cy) {
  if (guardT > 0) { say(pick(['ダメにゃ', 'いまはイヤにゃ', 'おやつくれたら考えるにゃ'])); blip(120, 90, 0.15, 'square', 0.06); return; }
  const tnow = performance.now();
  combo = tnow - lastTap < 700 ? combo + 1 : 1; lastTap = tnow;
  if (combo > cfg.stats.maxCombo) cfg.stats.maxCombo = combo;
  if (combo % 10 === 0 && cx) pop(combo + 'コンボ！', cx, cy - 40);
  if (!chal) { mood -= cfg.mode === 'buru' ? 2 : 3; if (mood <= 0) { mood = 0; startGuard(); return; } }
  cfg.count++; save(); showCount();
  if (cfg.mode === 'purun') {
    sv += 420; om += rand(-3, 3); qv += 6;
    blip(330, 120, 0.25);
    if (cx) pop(pick(['ぷるん', 'プリッ', 'ぽよん']), cx, cy);
  } else if (cfg.mode === 'buru') {
    shakeT = SHAKE_DUR; qv += 4; om += rand(-2, 2);
    for (let i = 0; i < 6; i++) blip(240, 200, 0.05, 'square', 0.07, i * 0.07);
    if (cx) pop(pick(['ブルブル', 'ぷるぷるぷる', 'ビビビ']), cx, cy);
  } else {
    const dir = Math.abs(om) > 1 ? Math.sign(om) : (Math.random() < 0.5 ? -1 : 1);
    om = clamp(om + dir * 14, -80, 80); qv += 3;
    blip(180, 520, 0.18, 'triangle');
    if (cx) pop(pick(['ブンッ', 'ブンブン', 'ギュルン']), cx, cy);
  }
  if (Math.random() < 0.4) say(pick(LINES[cfg.mode]));
}

// ---- つまむ・引っぱる・タップ ----
let drag = null;
function svgPoint(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
const balls = $('balls');
balls.addEventListener('pointerdown', (e) => {
  if (guardT > 0) { tap(0, 0); return; }
  balls.setPointerCapture(e.pointerId);
  drag = { x: e.clientX, y: e.clientY, moved: false, lastTh: th, t: performance.now() };
  e.preventDefault();
});
balls.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 7) return;
  drag.moved = true;
  const p = svgPoint(e), dx = p.x - 200, dy = p.y - (318 - lift);
  const target = Math.atan2(dx, dy);
  let d = target - (th % (2 * Math.PI));
  d = Math.atan2(Math.sin(d), Math.cos(d));               // 近い方へ回す
  const now = performance.now(), dt = Math.max(0.008, (now - drag.t) / 1000);
  om = om * 0.6 + (d / dt) * 0.4; drag.t = now;
  th += d;
  s = clamp(Math.hypot(dx, dy) - L, -12, 90); sv = 0;
  if (s >= 88) cfg.stats.stretch = true;
});
const release = (e) => {
  if (!drag) return;
  if (!drag.moved) tap(e.clientX, e.clientY);
  else { om = clamp(om, -45, 45); cfg.count++; save(); showCount(); blip(140, 360, 0.22); pop('びよ〜ん', e.clientX, e.clientY); }
  drag = null;
};
balls.addEventListener('pointerup', release);
balls.addEventListener('pointercancel', () => { drag = null; });

// ---- 毎フレームの計算と描画 ----
const rot = $('rot'), ring = $('ring'), cat = $('cat'), shadow = $('shadow');
const posEls = svg.querySelectorAll('.ballsPos'), neck = [$('neckLine'), $('neckFill')];
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  const K = 500 - cfg.soft * 380, C = 5 + (1 - cfg.soft) * 6, G = cfg.grav * 45;
  const h = dt / 3;
  for (let i = 0; i < 3; i++) {
    if (!drag || !drag.moved) {
      om += (-G * Math.sin(th) - 0.9 * om) * h;
      th -= 0; th += om * h;
      sv += (-K * s - C * sv + K * 0.013 * om * om) * h;
      s = clamp(s + sv * h, -12, 90);
    }
    qv += (-260 * q - 7 * qv) * h; q += qv * h;
    // 1回転ごとにカウント
    if (Math.abs(om) > 7) { turn += Math.abs(om * h); if (turn >= 2 * Math.PI) { turn -= 2 * Math.PI; cfg.count++; showCount(); } }
    else turn = 0;
  }
  let shakeX = 0;
  if (shakeT > 0) { shakeX = Math.sin(now * 0.09) * 7 * (shakeT / SHAKE_DUR); shakeT -= dt; }
  const st = clamp(s / (L * 2.5), -0.25, 0.5);
  const sx = clamp(1 - st * 0.5 + q, 0.5, 1.6), sy = clamp(1 + st - q, 0.5, 1.7);
  rot.setAttribute('transform', `rotate(${-th * 180 / Math.PI})`);
  posEls.forEach((g) => g.setAttribute('transform', `translate(${shakeX},${L + s}) scale(${sx},${sy})`));
  neck.forEach((n) => { n.setAttribute('x2', shakeX); n.setAttribute('y2', L + s); });

  // 回しすぎると竹とんぼのように浮く
  const speed = Math.abs(om);
  ring.setAttribute('r', L + s); ring.setAttribute('opacity', clamp((speed - 12) / 40, 0, 0.45));
  ring.setAttribute('transform', `rotate(${now * 0.5 % 360})`);
  lift += (clamp((speed - 30) * 5, 0, 150) - lift) * Math.min(1, dt * 3);
  cat.setAttribute('transform', `translate(0,${-lift}) rotate(${lift > 1 ? Math.sin(now / 300) * 2.5 : 0} 200 300)`);
  shadow.setAttribute('rx', 120 * (1 - lift / 320)); shadow.setAttribute('opacity', 0.18 * (1 - lift / 250));
  if (lift > 25 && !flying) { flying = true; cfg.stats.flew = true; say('飛んでるにゃ〜！', true); blip(400, 900, 0.5, 'sine', 0.12); save(); }
  if (lift < 5 && flying) { flying = false; say('着地にゃ', true); save(); }

  // あそびの更新：ごきげん回復、ガード解除、記録、チャレンジの残り時間
  if (guardT > 0) { guardT -= dt; if (guardT <= 0) endGuard(); }
  else if (now - lastTap > 1200) mood = Math.min(100, mood + 6 * dt);
  $('moodFill').style.width = mood + '%';
  $('moodFill').style.background = mood > 50 ? '#6cc070' : mood > 25 ? '#e8b339' : '#e2574c';
  const rpm = speed * 60 / (2 * Math.PI);
  if (rpm > cfg.stats.maxRpm) { cfg.stats.maxRpm = rpm; dirty = true; }
  if (cfg.grav === 0 && speed > 20) cfg.stats.zero = true;
  if (chal) {
    const left = (chal.end - now) / 1000, n = cfg.count - chal.base;
    if (left > 0) $('hint').textContent = `のこり ${left.toFixed(1)}秒 ｜ ${n}回`;
    else {
      const best = n > cfg.stats.chalBest;
      if (best) cfg.stats.chalBest = n;
      say(`${n}回にゃ！` + (best ? ' 新記録にゃ！' : '') + ' シェアするにゃ？', true); blip(500, 1000, 0.4, 'triangle', 0.12);
      lastChal = n; $('shareBtn').classList.add('ready');
      chal = null; $('hint').classList.remove('live'); $('hint').textContent = HINT; dirty = true;
    }
  }
  if ((tick += dt) > 0.5) { tick = 0; checkBadges(); if (dirty) { dirty = false; save(); } }

  requestAnimationFrame(frame);
}
$('hint').textContent = HINT;
applyLook();
renderBadges();
requestAnimationFrame(frame);
</script>
</body>
</html>
